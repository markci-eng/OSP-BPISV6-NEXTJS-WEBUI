<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · One St. Peter</title>
    <!--
      Deliberately self-contained: no Next.js runtime, no external CSS, no web
      fonts. This page has to render when nothing else can be fetched, so every
      byte it needs is inline.
    -->
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 26rem;
        padding: 2.5rem 2rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1rem;
        box-shadow: 0 10px 30px -12px rgb(15 23 42 / 0.18);
        text-align: center;
      }

      .icon {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #f1f5f9;
        color: var(--accent);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 1.5rem;
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--muted);
      }

      button {
        width: 100%;
        padding: 0.7rem 1rem;
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 0.55rem;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.9;
      }

      .status {
        margin: 1rem 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .status[data-online="true"] {
        color: var(--accent);
        font-weight: 600;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0b1120;
          --card: #111a2e;
          --ink: #e2e8f0;
          --muted: #94a3b8;
          --line: #1e293b;
          --accent: #2dd4bf;
        }

        .icon {
          background: #16213a;
        }

        button {
          color: #06231f;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        >
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <path d="M12 20h.01" />
        </svg>
      </div>

      <h1>You&rsquo;re offline</h1>
      <p>
        This page hasn&rsquo;t been saved for offline use yet. Pages you&rsquo;ve
        already visited stay available &mdash; reconnect to load anything new.
      </p>

      <button type="button" id="retry">Try again</button>
      <p class="status" id="status">Waiting for a connection&hellip;</p>
    </main>

    <script>
      (function () {
        var status = document.getElementById("status");
        var retry = document.getElementById("retry");

        function render() {
          var online = navigator.onLine;
          status.dataset.online = String(online);
          status.textContent = online
            ? "Connection restored — reloading…"
            : "Waiting for a connection…";
          if (online) setTimeout(reload, 600);
        }

        function reload() {
          window.location.reload();
        }

        retry.addEventListener("click", reload);
        window.addEventListener("online", render);
        window.addEventListener("offline", render);
        render();
      })();
    </script>
  </body>
</html>
